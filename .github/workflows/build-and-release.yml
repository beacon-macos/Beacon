name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Run master and tag builds one at a time so each release sees the tag created by the previous one.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Beacon
    runs-on: macos-26
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run unit tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Beacon.xcodeproj \
            -scheme Beacon \
            -destination "platform=macOS" \
            -derivedDataPath test-build \
            -only-testing:BeaconTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Determine version
        id: version
        run: |
          set -euo pipefail

          version="0.0.0"
          release="false"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must use the format v1.2.3" >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            release="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/master" ]]; then
            latest_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
            range="${latest_tag:+${latest_tag}..}HEAD"

            # feat bumps the minor version, fix and perf bump the patch version,
            # and "type!:" or a BREAKING CHANGE footer bumps the major version.
            breaking_re='^[a-z]+(\([^)]*\))?!:'
            feat_re='^feat(\([^)]*\))?:'
            fix_re='^(fix|perf)(\([^)]*\))?:'

            bump=""
            while IFS= read -r -d '' message || [[ -n "${message}" ]]; do
              subject="${message%%$'\n'*}"
              if [[ "${subject}" =~ ${breaking_re} ]] || grep -q '^BREAKING[ -]CHANGE:' <<< "${message}"; then
                bump="major"
                break
              elif [[ "${subject}" =~ ${feat_re} ]]; then
                bump="minor"
              elif [[ "${subject}" =~ ${fix_re} && -z "${bump}" ]]; then
                bump="patch"
              fi
            done < <(git log -z --format=%B "${range}")

            if [[ -n "${bump}" ]]; then
              IFS=. read -r major minor patch <<< "${latest_tag:-v0.0.0}"
              major="${major#v}"
              case "${bump}" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                patch) patch=$((patch + 1)) ;;
              esac
              version="${major}.${minor}.${patch}"
              release="true"
            else
              echo "No feat, fix, perf, or breaking commits since ${latest_tag:-the first commit}; skipping the release."
            fi
          fi

          echo "Version: ${version} (release: ${release})"
          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "release=${release}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build universal release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          xcodebuild build \
            -project Beacon.xcodeproj \
            -scheme Beacon \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Ad-hoc sign and verify application
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app="build/Build/Products/Release/Beacon.app"

          expected_version="${VERSION}"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${app}/Contents/Info.plist")"
          if [[ "${app_version}" != "${expected_version}" ]]; then
            echo "App version ${app_version} does not match expected version ${expected_version}" >&2
            exit 1
          fi

          codesign --force --deep --options runtime --sign - "${app}"
          codesign --verify --deep --strict --verbose=2 "${app}"
          lipo -archs "${app}/Contents/MacOS/Beacon" | grep -q arm64
          lipo -archs "${app}/Contents/MacOS/Beacon" | grep -q x86_64

      - name: Create ZIP, DMG, and PKG
        env:
          RELEASE: ${{ steps.version.outputs.release }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist

          if [[ "${RELEASE}" == "true" ]]; then
            package_name="Beacon-${TAG}"
          else
            package_name="Beacon-build-${GITHUB_RUN_NUMBER}"
          fi

          app="build/Build/Products/Release/Beacon.app"

          ditto -c -k --sequesterRsrc --keepParent \
            "${app}" \
            "dist/${package_name}.zip"

          mkdir -p dmg-root
          ditto "${app}" "dmg-root/Beacon.app"
          ln -s /Applications "dmg-root/Applications"
          hdiutil create \
            -volname "Beacon" \
            -srcfolder "dmg-root" \
            -ov \
            -format UDZO \
            "dist/${package_name}.dmg"

          pkgbuild \
            --component "${app}" \
            --install-location "/Applications" \
            "dist/${package_name}.pkg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Beacon-build
          path: |
            dist/*.dmg
            dist/*.pkg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: needs.build.outputs.release == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the update public key
        uses: actions/checkout@v6
        with:
          sparse-checkout: Beacon/Updater.swift
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: Beacon-build
          path: dist

      - name: Sign update archive
        env:
          TAG: ${{ needs.build.outputs.tag }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${UPDATE_SIGNING_KEY}" ]]; then
            echo "The UPDATE_SIGNING_KEY secret is not set" >&2
            exit 1
          fi

          key="${RUNNER_TEMP}/update-signing-key.pem"
          trap 'rm -f "${key}"' EXIT
          (umask 077 && printf '%s\n' "${UPDATE_SIGNING_KEY}" > "${key}")

          # Beacon accepts only archives signed by the key matching this public key.
          public_key="$(sed -n 's/.*signingPublicKey = Data(base64Encoded: "\([^"]*\)").*/\1/p' Beacon/Updater.swift)"
          signing_public_key="$(openssl pkey -in "${key}" -pubout -outform DER | tail -c 32 | base64)"
          if [[ -z "${public_key}" || "${signing_public_key}" != "${public_key}" ]]; then
            echo "UPDATE_SIGNING_KEY does not match signingPublicKey in Beacon/Updater.swift" >&2
            exit 1
          fi

          archive="dist/Beacon-${TAG}.zip"
          openssl pkeyutl -sign -rawin -inkey "${key}" -in "${archive}" -out "${archive}.sig"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          # Creates the tag on this commit when it does not exist yet. Tags created with
          # the workflow token do not trigger another run of this workflow.
          gh release create "${TAG}" \
            dist/*.dmg \
            dist/*.pkg \
            dist/*.zip \
            dist/*.zip.sig \
            --target "${GITHUB_SHA}" \
            --generate-notes \
            --title "Beacon ${TAG}"
